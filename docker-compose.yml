services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ai-interviewer-postgres
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # 后端 API（FastAPI + Python）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interviewer-backend
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_interviewer
    env_file:
      - server/.env
    volumes:
      - ./:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # 前端开发服务（Vite）
  frontend:
    image: node:20-alpine
    container_name: ai-interviewer-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:
