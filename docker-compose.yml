# ============================================
# 一键启动（评审 / 演示推荐）
#
#   1) （可选）配置凭证：cp .env.example .env 并填入 Key
#      不配置也能启动，只是 LLM 出题/点评与具身交互智能体播报不可用
#   2) docker compose up -d --build
#   3) 打开 http://localhost:8080
#
# 开发模式（源码热更新）请用：
#   docker compose -f docker-compose.dev.yml up -d
# ============================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ai-interviewer-postgres
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 后端 API（FastAPI + Python）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    container_name: ai-interviewer-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_interviewer
      - AVATAR_APP_ID=${AVATAR_APP_ID:-}
      - AVATAR_APP_SECRET=${AVATAR_APP_SECRET:-}
      - AVATAR_GATEWAY_SERVER=${AVATAR_GATEWAY_SERVER:-https://nebula-agent.xingyun3d.com/user/v1/ttsa_v2/session}
      - AVATAR_PROXY_BASE_URL=${AVATAR_PROXY_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-in-production-32bytes!!}
      # 离线规则模式（无模型、无 Key 也能跑通面试主流程）：OFFLINE_MODE=true docker compose up -d
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 前端（Vite 构建产物 + Nginx 反向代理）
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-interviewer-frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
