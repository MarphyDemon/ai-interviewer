name: CI

on:
  push:
  pull_request:

# 同一分支/PR 有新提交时取消旧运行，避免浪费 CI 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 Lint / 类型检查 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # 根目录 .npmrc 含 @xmov:registry=https://npm.xmov.ai（匿名可访问，无需鉴权）
      - name: 安装依赖 (npm ci)
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: 类型检查 (vue-tsc)
        run: npm run typecheck

      - name: 生产构建 (web 模式)
        run: npm run build:web

  backend:
    name: 后端 Ruff 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: 安装后端依赖
        run: pip install -r server/requirements.txt

      # 版本与 server/requirements-dev.txt 保持一致，保证与本地结果一致
      - name: 安装 Ruff
        run: pip install ruff==0.8.4

      # 规则/行宽取仓库根 pyproject.toml（ruff 会自动向上查找配置）
      - name: Ruff 静态检查
        run: ruff check server
