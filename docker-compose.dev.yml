# ============================================
# 开发模式：源码挂载 + 热更新
#
#   docker compose -f docker-compose.dev.yml up -d
#   前端 http://localhost:5173 ，后端 http://localhost:8000
#
# 后端配置读取容器内 /app/server/.env（即宿主机的 server/.env）：
#   cp server/.env.example server/.env 并填入 Key
# 该文件不存在时服务仍可启动，只是 AI 能力不可用。
#
# 一键启动（评审 / 演示推荐）请用：
#   docker compose up -d --build
# ============================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ai-interviewer-postgres-dev
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 后端 API（FastAPI + Python，热重载）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    container_name: ai-interviewer-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_interviewer
    volumes:
      - ./:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # 前端开发服务（Vite）
  frontend:
    image: node:20-alpine
    container_name: ai-interviewer-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_dev:
  node_modules_dev:
