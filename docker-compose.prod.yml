services:
  # PostgreSQL 数据库 (生产环境)
  postgres:
    image: postgres:16-alpine
    container_name: ai-interviewer-postgres
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_interviewer_pg_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - ai-network

  # 后端 API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interviewer-backend
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-ai_interviewer_pg_pass_2026}@postgres:5432/ai_interviewer
    env_file:
      - server/.env
    volumes:
      - ./data:/app/data
      - ./server/.env:/app/server/.env:ro
    restart: always
    networks:
      - ai-network

  # Nginx (前端静态文件 + 反向代理)
  nginx:
    image: nginx:alpine
    container_name: ai-interviewer-nginx
    depends_on:
      - backend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: always
    networks:
      - ai-network

volumes:
  postgres_data:

networks:
  ai-network:
    driver: bridge
